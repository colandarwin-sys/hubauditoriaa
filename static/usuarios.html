<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios</title><link rel="stylesheet" href="/css/app.css"></head><body><script src="/js/shared.js"></script><script>pageShell('usuarios','Usuarios','Administra los accesos, nombres, roles y credenciales del portal.',`<div class="grid2"><section class="card"><h3>Nuevo usuario</h3><p class="muted">Los perfiles Gerente y Coordinador tienen el mismo alcance operativo. Solo Administrador gestiona usuarios y perfiles.</p><form id="userForm"><div class="field"><label>Usuario</label><input name="username" autocomplete="off" required></div><div class="field" style="margin-top:10px"><label>Nombre</label><input name="display_name" required></div><div class="field" style="margin-top:10px"><label>Rol</label><select name="role"><option value="coordinador">Coordinador</option><option value="gerente">Gerente</option><option value="administrador">Administrador</option></select></div><div class="field" style="margin-top:10px"><label>Contraseña</label><input name="password" type="password" autocomplete="new-password" required></div><button class="btn primary" style="margin-top:14px">Crear usuario</button></form></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h3 style="margin-bottom:4px">Usuarios registrados</h3><p class="muted" style="margin-top:0">Puedes editar usuario, nombre, rol y contraseña.</p></div></div><div id="users"><div class="empty">Cargando…</div></div></section></div><div id="editUserModal" class="modal hidden"><div class="modal-card" style="width:min(560px,100%)"><div class="modal-head"><div><h3 style="margin:0">Editar usuario</h3><p class="muted" style="margin:4px 0 0">Deja la contraseña vacía si deseas conservar la actual.</p></div><button class="btn" type="button" id="closeUserModal">Cerrar</button></div><form id="editUserForm"><input type="hidden" name="id"><div class="grid2"><div class="field"><label>Usuario</label><input name="username" required></div><div class="field"><label>Nombre</label><input name="display_name" required></div><div class="field"><label>Rol</label><select name="role"><option value="coordinador">Coordinador</option><option value="gerente">Gerente</option><option value="administrador">Administrador</option></select></div><div class="field"><label>Nueva contraseña</label><input name="password" type="password" autocomplete="new-password" placeholder="Sin cambios"></div><div class="field span2"><label>Estado</label><select name="active"><option value="1">Activo</option><option value="0">Inactivo</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary">Guardar cambios</button><button class="btn" type="button" id="cancelUserEdit">Cancelar</button></div></form></div></div>`);loadSession();</script><script src="/js/users.js"></script></body></html>
