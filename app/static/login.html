<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Hub Auditoría · Iniciar sesión</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap' rel='stylesheet'><style>

837 50 L859 64 L887 13 L911 92 L935 55 H1282 L1324 55 L1354 50 L1376 64 L1404 13 L1428 92 L1452 55 H1800');offset-distance:0%;animation:runner 10s linear infinite -5s}@keyframes ekgDraw{0%{stroke-dashoffset:2200;opacity:0}10%{opacity:1}45%{stroke-dashoffset:0;opacity:1}50%{opacity:.96}100%{stroke-dashoffset:0;opacity:0}}@keyframes runner{0%{offset-distance:0%;opacity:0}10%{opacity:1}45%{offset-distance:49%;opacity:1}50%{opacity:0}100%{offset-distance:49%;opacity:0}}.login-card{position:relative;z-index:2;width:min(458px,calc(100vw - 40px));padding:34px 34px 30px;background:linear-gradient(160deg,#112217,#09120d);color:var(--ink);border-radius:28px;border:1px solid rgba(205,255,0,.2);box-shadow:0 30px 80px rgba(10,18,11,.27),0 0 0 1px rgba(255,255,255,.03) inset}.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 18px}.logo{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(160deg,#0b140d,#111d12);border:1px solid rgba(205,255,0,.18);box-shadow:0 12px 26px rgba(0,0,0,.22)}.logo svg{width:40px;height:40px;display:block}.brand strong{display:block;font-size:22px;line-height:1.02;letter-spacing:-.05em}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#9bb39a;text-transform:uppercase;margin-bottom:4px}.login-card h1{margin:0 0 18px;font-size:32px;letter-spacing:-.06em;line-height:1.02;text-align:center}.sub{font-size:13px;color:var(--muted);line-height:1.75;margin:0 0 24px;max-width:340px}.form{display:grid;gap:17px}.field{display:grid;gap:8px}.field label{font-size:10px;letter-spacing:.12em;font-weight:800;color:#ccddc8;text-transform:uppercase}.input-shell{display:flex;align-items:center;gap:11px;padding:0 15px;min-height:54px;background:#0a160d;border:1px solid rgba(205,255,0,.14);border-radius:15px;transition:border-color .16s,box-shadow .16s,transform .16s}.input-shell:focus-within{border-color:rgba(205,255,0,.78);box-shadow:0 0 0 3px rgba(205,255,0,.08);transform:translateY(-1px)}.input-shell svg{width:17px;height:17px;stroke:#cfff65;flex:none}.input-shell input{background:transparent!important;border:0!important;outline:0!important;box-shadow:none!important;width:100%;height:50px;min-width:0;color:#fff!important;font:700 14px Manrope,Arial,sans-serif!important;caret-color:var(--lime)}.input-shell input:-webkit-autofill,.input-shell input:-webkit-autofill:hover,.input-shell input:-webkit-autofill:focus{-webkit-text-fill-color:#fff!important;-webkit-box-shadow:0 0 0 1000px #0a160d inset!important;box-shadow:0 0 0 1000px #0a160d inset!important;transition:background-color 99999s ease-in-out 0s!important}.password-eye{border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#baccb7}.remember{display:flex;align-items:center;gap:8px}.remember input{accent-color:var(--lime)}.submit{background:linear-gradient(90deg,#cdff00,#a9ff34);border:1px solid #b9f819;color:#112015;border-radius:15px;font:800 14px Manrope,sans-serif;min-height:52px;cursor:pointer;box-shadow:0 14px 36px rgba(205,255,0,.18);transition:transform .16s,filter .16s,box-shadow .16s}.submit:hover{filter:brightness(.98);transform:translateY(-1px);box-shadow:0 18px 38px rgba(205,255,0,.22)}.submit:active{transform:translateY(0)}.error{color:#ffb4b4;font-size:12px}.hidden{display:none!important}.login-note{margin-top:18px;padding-top:16px;border-top:1px solid rgba(205,255,0,.12);font-size:11px;color:#a8bcaa;display:flex;justify-content:space-between;gap:12px}@media(max-width:640px){.login-card{padding:28px 24px 24px}.brand strong{font-size:20px}.login-card h1{font-size:28px}.ekg-band{top:62%;height:104px}}@media(prefers-reduced-motion:reduce){.ekg-trace,.ekg-dot{animation:none!important}}
</style></head><body><div class='orb a'></div><div class='orb b'></div><div class='ekg-stage' aria-hidden='true'><div class='ekg-band'><svg viewBox='0 0 1800 110' preserveAspectRatio='none'><path class='ekg-base' d='M0 55 H250 L292 55 L322 50 L344 64 L372 13 L396 92 L420 55 H765 L807 55 L837 50 L859 64 L887 13 L911 92 L935 55 H1282 L1324 55 L1354 50 L1376 64 L1404 13 L1428 92 L1452 55 H1800'/><path class='ekg-trace' d='M0 55 H250 L292 55 L322 50 L344 64 L372 13 L396 92 L420 55 H765 L807 55 L837 50 L859 64 L887 13 L911 92 L935 55 H1282 L1324 55 L1354 50 L1376 64 L1404 13 L1428 92 L1452 55 H1800'/><path class='ekg-trace phase2' d='M0 55 H250 L292 55 L322 50 L344 64 L372 13 L396 92 L420 55 H765 L807 55 L837 50 L859 64 L887 13 L911 92 L935 55 H1282 L1324 55 L1354 50 L1376 64 L1404 13 L1428 92 L1452 55 H1800'/><circle class='ekg-dot motion1' r='4.6' cx='0' cy='0'></circle><circle class='ekg-dot motion2' r='4.6' cx='0' cy='0'></circle></svg></div></div><main class='login-card'><div class='brand'><span class='logo'><svg viewBox='0 0 72 72' aria-hidden='true' focusable='false'>
  <defs><linearGradient id='hubRingMini' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#cdff00'/><stop offset='100%' stop-color='#72e43b'/></linearGradient></defs>
  <path d='M47 20.8A18 18 0 1 0 47 51.2' fill='none' stroke='url(#hubRingMini)' stroke-width='8.5' stroke-linecap='round'/>
  <circle cx='49.5' cy='36' r='4.8' fill='#cdff00'/>
</svg></span><div><small>Portal integrado</small><strong>Hub Auditoría</strong></div></div><h1>Iniciar sesión</h1><form id='loginForm' class='form'><div class='field'><label for='userInput'>Usuario</label><div class='input-shell'><svg viewBox='0 0 24 24' fill='none' stroke-width='1.8'><path d='M20 21a8 8 0 0 0-16 0'/><circle cx='12' cy='7' r='4'/></svg><input id='userInput' autocomplete='username' placeholder='Usuario' required></div></div><div class='field'><label for='passInput'>Contraseña</label><div class='input-shell'><svg viewBox='0 0 24 24' fill='none' stroke-width='1.8'><rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V8a4 4 0 0 1 8 0v3'/></svg><input id='passInput' type='password' autocomplete='current-password' placeholder='Contraseña' required><button class='password-eye' id='togglePass' type='button' aria-label='Mostrar contraseña'><svg viewBox='0 0 24 24' fill='none' stroke-width='1.8'><path d='M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z'/><circle cx='12' cy='12' r='3'/></svg></button></div></div><div class='row'><label class='remember'><input id='remember' type='checkbox'>Recordarme</label><span>Entorno interno</span></div><div class='error hidden' id='errorBox'></div><button type='submit' class='submit'>Ingresar al portal →</button></form></main><script>
const userInput=document.getElementById('userInput'),passInput=document.getElementById('passInput'),errorBox=document.getElementById('errorBox'),remember=document.getElementById('remember');
const saved=localStorage.getItem('auditoria_remember_user');
if(saved){userInput.value=saved;remember.checked=true}
document.getElementById('togglePass').onclick=()=>{passInput.type=passInput.type==='password'?'text':'password'};
document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();
  errorBox.classList.add('hidden');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:userInput.value.trim(),password:passInput.value})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'No se pudo iniciar sesión');
    try{if(j.user)sessionStorage.setItem('aud_cached_user',JSON.stringify(j.user));}catch(e){}
    if(remember.checked) localStorage.setItem('auditoria_remember_user',userInput.value.trim());
    else localStorage.removeItem('auditoria_remember_user');
    location.href='/inicio.html';
  }catch(err){
    errorBox.textContent=err.message||'No se pudo iniciar sesión.';
    errorBox.classList.remove('hidden');
  }
};
</script></body></html>
