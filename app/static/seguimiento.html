<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento operativo</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/unified.css"><style>html,body{margin:0;background:#f0ffe3!important}</style></head><body class="aud-distribucion"><script src="/js/unified.js"></script><script src="/js/shared.js"></script><script>pageShell('seguimiento','Seguimiento operativo','Compara la carga planificada con el avance real acumulado del equipo.',`<section class="card"><div class="actions" style="justify-content:space-between"><div><h3>Periodo de seguimiento</h3><p class="muted">Selecciona una distribución guardada y registra cortes diarios o periódicos.</p></div><div class="actions"><select id="runSelect" class="select-inline"></select><a id="trackingExport" class="btn" href="#">Descargar Excel</a></div></div></section><div id="trackingKpis" class="grid4"></div><section class="card"><div class="cardhead"><div><h3>Avance planificado vs ejecutado</h3><p class="muted">Porcentaje acumulado por colaborador según expedientes o concurrencia.</p></div></div><div class="chart-wrap"><canvas id="progressChart" height="340"></canvas></div></section><div class="grid2"><section class="card"><h3>Registrar avance</h3><form id="trackingForm" class="form-stack"><div class="field"><label>Fecha del corte</label><input type="date" name="entry_date" required></div><div class="field"><label>Colaborador</label><select name="person_name" required></select></div><div class="field"><label>Flujo</label><select name="stream"><option>Médica</option><option>Enfermería</option></select></div><div class="field"><label>Tipo de avance</label><select name="metric_type"><option>Facturación</option><option>Concurrencia</option></select></div><div class="pair"><div class="field"><label>Cantidad realizada</label><input type="number" step="1" min="0" name="qty" value="0"></div><div class="field"><label>Horas reales (opcional)</label><input type="number" step="0.1" min="0" name="hours" value="0"></div></div><div class="field"><label>Observación</label><input name="notes" placeholder="Ej.: corte al cierre de turno"></div><button class="btn primary">Guardar avance</button></form></section><section class="card"><h3>Lectura estadística</h3><div id="trackingInsights" class="dashboardInsights"></div></section></div><section class="card"><div class="cardhead"><div><h3>Registros de seguimiento</h3><p class="muted">Cada corte queda almacenado en SQLite.</p></div></div><div id="trackingTable" class="tracking-table"></div></section>`);loadSession().then(u=>{audUser=u; const a=document.getElementById("aud-username");if(a&&u)a.textContent=u.display_name;});</script><script src="/js/tracking.js"></script></body></html>
