</style></head><body class="aud-distribucion"><script src="/js/unified.js"></script><script src="/js/shared.js"></script><script>pageShell('usuarios','Gestión de usuarios y accesos','Administra usuarios del portal integrado y define permisos por portal, módulo y vistas específicas.',`<div class="users-stage"><section class="hero-users"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">CONTROL INTEGRAL DE ACCESOS</div><h2>Usuarios, portales y permisos en un solo lugar</h2><p>Esta vista administra todos los accesos del portal integrado. Puedes definir ingreso general, habilitación de módulos completos y permisos específicos dentro de Expedientes pendientes, Gestión de tarifarios y Distribución de tareas.</p></div><div class="hero-kpis"><div class="userkpi"><small>Usuarios activos</small><strong id="kpiUsers">—</strong></div><div class="userkpi"><small>Módulos</small><strong>3</strong></div><div class="userkpi"><small>Nivel de control</small><strong>Detalle</strong></div></div></div></section><div class="split-grid"><section class="section-card"><h3>Nuevo usuario</h3><p>Crea un usuario nuevo y define exactamente a qué puede entrar.</p><form id="userForm"><div class="form-grid"><div class="field"><label>Usuario</label><input name="username" autocomplete="off" required></div><div class="field"><label>Nombre</label><input name="display_name" required></div><div class="field"><label>Rol</label><select name="role" id="newRole"><option value="coordinador">Coordinador</option><option value="gerente">Gerente</option><option value="administrador">Administrador</option></select></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="new-password" required></div><div class="span2"><div id="newPermissions"></div></div></div><button class="btn primary" style="margin-top:16px">Crear usuario</button></form></section><section class="section-card"><h3>Estructura de permisos</h3><p>Así funciona la nueva gestión de accesos dentro del portal integrado.</p><div class="legend-list"><div class="legend-item"><b>1</b><div><strong>Acceso general</strong><div class="muted">Controla si el usuario puede entrar al portal integrado.</div></div></div><div class="legend-item"><b>2</b><div><strong>Acceso por módulo</strong><div class="muted">Activa o desactiva Expedientes pendientes, Tarifarios y Distribución de tareas.</div></div></div><div class="legend-item"><b>3</b><div><strong>Acceso por vistas</strong><div class="muted">Dentro de cada módulo puedes elegir exactamente qué pantallas puede usar.</div></div></div><div class="legend-item"><b>4</b><div><strong>Gestión de usuarios</strong><div class="muted">Solo debe quedar habilitada para administradores o usuarios con control especial.</div></div></div></div></section></div><section class="section-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h3 style="margin-bottom:6px">Usuarios registrados</h3><p style="margin-top:0">Consulta, edita y ajusta el alcance de cada usuario dentro del portal integrado.</p></div></div><div id="users"><div class="empty">Cargando…</div></div></section></div><div id="editUserModal" class="modal hidden"><div class="modal-card" style="width:min(1100px,100%)"><div class="modal-head"><div><h3 style="margin:0">Editar usuario</h3><p class="muted" style="margin:4px 0 0">Actualiza credenciales, rol, estado y permisos por módulo.</p></div><button class="btn" type="button" id="closeUserModal">Cerrar</button></div><form id="editUserForm"><input type="hidden" name="id"><div class="hub-user-photo-editor"><div id="userPhotoPreview" class="hub-profile-photo-circle">👤</div><div><label class="hub-profile-photo-pick" for="editUserPhoto">📷 Cambiar foto del usuario</label><input type="file" id="editUserPhoto" accept="image/jpeg,image/png,image/webp" hidden><p class="muted">Vista previa · fotografía vinculada al usuario</p><button type="button" id="removeUserPhoto" class="hub-photo-remove">Quitar fotografía</button></div></div><div class="form-grid"><div class="field"><label>Usuario</label><input name="username" required></div><div class="field"><label>Nombre</label><input name="display_name" required></div><div class="field"><label>Rol</label><select name="role" id="editRole"><option value="coordinador">Coordinador</option><option value="gerente">Gerente</option><option value="administrador">Administrador</option></select></div><div class="field"><label>Nueva contraseña</label><input name="password" type="password" autocomplete="new-password" placeholder="Sin cambios"></div><div class="field span2"><label>Estado</label><select name="active"><option value="1">Activo</option><option value="0">Inactivo</option></select></div><div class="span2"><div id="editPermissions"></div></div></div><div class="actions" style="margin-top:16px"><button class="btn primary">Guardar cambios</button><button class="btn" type="button" id="cancelUserEdit">Cancelar</button></div></form></div></div>`);</script><script src="/js/users.js"></script></body></html>
