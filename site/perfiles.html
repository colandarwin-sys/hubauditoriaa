<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfiles del equipo</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/unified.css"><style>html,body{margin:0;background:#f0ffe3!important}</style></head><body class="aud-distribucion"><script src="/js/unified.js"></script><script src="/js/shared.js"></script><script>pageShell('perfiles','Perfiles del equipo','Clasifica una sola vez a cada colaborador. El portal reutiliza este perfil cuando vuelva a aparecer en futuros horarios.',`<section class="card"><div class="actions" style="justify-content:space-between"><div><h3>Maestro de perfiles</h3><p class="muted">Médico, Enfermería, Otro o Revisar. Los perfiles “Otro” no ingresan al motor de distribución.</p></div><button id="newProfile" class="btn primary">+ Nuevo perfil</button></div><div id="profilesGrid" class="profile-table" style="margin-top:14px"></div></section><div id="profileModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3>Editar perfil</h3><button id="closeProfile" class="btn small">Cerrar</button></div><form id="profileForm" class="grid2"><input type="hidden" name="id"><div class="field span2"><label>Nombre</label><input name="display_name" required></div><div class="field"><label>Tipo</label><select name="kind"><option>Médico</option><option>Enfermería</option><option>Otro</option><option>Revisar</option></select></div><div class="field"><label>Modalidad</label><select name="mode"><option>Presencial</option><option>Virtual</option><option>Mixto</option></select></div><div class="field span2"><label>Fortaleza / observación</label><input name="strength"></div><label class="checkline"><input type="checkbox" name="fact"> Habilitado para facturación</label><label class="checkline"><input type="checkbox" name="concurrence" checked> Habilitado para concurrencia</label><div class="actions span2"><button class="btn primary">Guardar perfil</button></div></form></div></div>`);loadSession().then(u=>{audUser=u; const a=document.getElementById("aud-username");if(a&&u)a.textContent=u.display_name;});</script><script src="/js/profiles.js"></script></body></html>
