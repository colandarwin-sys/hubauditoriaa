<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instalación · Hub Auditoría</title><style>body{background:#cdff00;font:15px system-ui;display:grid;min-height:95vh;place-items:center;color:#eaffd7}main{background:#0e1e13;border-radius:22px;padding:28px;width:min(440px,90vw)}h1{margin-top:0}input,button{box-sizing:border-box;display:block;width:100%;padding:14px;border-radius:10px;margin:10px 0;border:1px solid #607439}button{background:#cdff00;color:#0e1e13;font-weight:800;cursor:pointer}input{background:#19271e;color:#fff}p{line-height:1.5}#msg{white-space:pre-wrap}</style><main><h1>Instalación inicial</h1><p>Disponible únicamente cuando Supabase y las credenciales de instalación están configuradas en Netlify y todavía no existe ningún usuario Hub.</p><form id="f"><input name="username" placeholder="Usuario administrador" required autocomplete="off"><input name="password" type="password" placeholder="Contraseña de instalación" required><input name="display_name" placeholder="Nombre visible" required><button>Crear primer administrador</button></form><p id="msg"></p><a style="color:#cdff00" href="/login.html">Ir al inicio de sesión</a></main><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));const m=document.getElementById('msg');m.textContent='Configurando…';try{const r=await fetch('/api/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);m.textContent='Administrador creado. Ve a Iniciar sesión.';}catch(err){m.textContent=err.message}}</script></html>
